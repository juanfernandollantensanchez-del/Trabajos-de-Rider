<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse Lunar Total</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Eclipse lunar total</h1>
    
    <div class="scene">
        <div class="subtitle">La Luna pasa completamente a través de la umbra</div>

        <div class="sun"></div>
        <div class="label label-sol">Sol</div>

        <div class="wedge-left"></div>
        <div class="wedge-right"></div>
        <div class="wedge-top"></div>
        <div class="wedge-bot"></div>

        <div class="umbra"></div>
        <div class="penumbra-top"></div>
        <div class="penumbra-bottom"></div>

        <div class="earth">
            <div class="earth-shadow"></div>
        </div>
        <div class="label label-tierra">Tierra</div>

        <div class="moon"></div>
        <div class="label label-luna">Luna</div>
        <div class="luna-line"></div>

        <div class="label label-umbra">Umbra</div>
        <div class="umbra-line"></div>

        <div class="label label-penumbra">Penumbra</div>
        <div class="penumbra-line"></div>

        <div class="footer">Diagrama ilustrativo (no a escala)</div>
    </div>
</div>

</body>
</html>
