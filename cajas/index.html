<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Completo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="juan1">Juan</h1>

<h1 class="juan2">Juan</h1>

<h1 class="juan3">Juan</h1>

<h1 class="juan4">Juan</h1>

<h1 class="juan5">Juan</h1>

    <div class="contenedor">

        <!-- Cajas de texto -->
        <input type="text" class="caja caja1" placeholder="Escribe tu nombre">

        <input type="email" class="caja caja2" placeholder="Escribe tu correo">

        <input type="text" class="caja caja3" placeholder="Escribe un mensaje">

        <!-- Botones -->
        <div class="boton boton1">Enviar</div>
        <div class="boton boton2">Guardar</div>
        <div class="boton boton3">Cancelar</div>

        <!-- Botón de apagado -->
        <div class="power-button">
            <div class="power-logo"></div>
        </div>

        <!-- Semáforo -->
        <div class="semaforo">

            <div class="luz rojo"></div>

            <div class="luz amarillo"></div>

            <div class="luz verde"></div>

        </div>

    </div>

    <!-- Diferencia Box Shadow y Drop Shadow -->
<div class="sombras">

    <div class="caja-shadow box-shadow">
        Box Shadow
    </div>

    <div class="caja-shadow drop-shadow">
        Drop Shadow
    </div>

</div>

<div class="caja-inset">
    Box Shadow Inset
</div>

<!-- Contenedor con imagen -->
<div class="contenedor-img"></div>

<h1 class="texto-clip">
    Juan Fernando
</h1>
</h2>


<div class="login-bg">

    <div class="login-box">

        <h2 class="login-title">Iniciar Sesión</h2>

        <input type="text" class="login-input" placeholder="Usuario">

        <input type="password" class="login-input" placeholder="Contraseña">

        <div class="login-check">
            <input type="checkbox"> Recordarme
        </div>
