<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Cartas</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>

    <h1>Ejercicio</h1>

    <div class="contenedor">

        <!-- 10 -->
        <div class="carta carta1">
            <div class="esquina superior">10♦</div>

            <div class="diamante d1">♦</div>
            <div class="diamante d2">♦</div>
            <div class="diamante d3">♦</div>
            <div class="diamante d4">♦</div>
            <div class="diamante d5">♦</div>
            <div class="diamante d6">♦</div>
            <div class="diamante d7">♦</div>
            <div class="diamante d8">♦</div>
            <div class="diamante d9">♦</div>
            <div class="diamante d10">♦</div>

            <div class="esquina inferior">10♦</div>
        </div>

        <div class="texto texto1">← z-index: 1</div>

        <!-- J -->
        <div class="carta carta2">
            <div class="esquina superior">J♦</div>

            <div class="figura">♙</div>

            <div class="esquina inferior">J♦</div>
        </div>

        <div class="texto texto2">← z-index: 2</div>

        <!-- Q -->
        <div class="carta carta3">
            <div class="esquina superior">Q♦</div>

            <div class="figura">♕</div>

            <div class="esquina inferior">Q♦</div>
        </div>

        <div class="texto texto3">← z-index: 3</div>

        <!-- K -->
        <div class="carta carta4">
            <div class="esquina superior">K♦</div>

            <div class="figura">♔</div>

            <div class="esquina inferior">K♦</div>
        </div>

        <div class="texto texto4">← z-index: 4</div>

        <!-- A -->
        <div class="carta carta5">
            <div class="esquina superior">A♦</div>

            <div class="as">♦</div>

            <div class="esquina inferior">A♦</div>
        </div>

        <div class="texto texto5">← z-index: 5</div>

    </div>

</body>
</html>
