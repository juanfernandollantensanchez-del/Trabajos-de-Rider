<!DOCTYPE html>

<body>

    <header class="menu-superior">

        <nav>
            <ul class="enlaces">

                <li><a href="#proyectos">Proyectos</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="inicio" class="seccion-hero">

                <div class="tarjeta-proyecto">

            </div>
            <div class="parent">
    <div class="first child">First child</div>
    <div class="second child">Second child</div>
    <div class="third child">Third child</div>
</div>
        </section>
    </main>

    <button id="boton-tema" style="position: fixed; bottom: 20px; right: 20px; padding: 15px; background-color: #333; color: white; border: none; border-radius: 8px; cursor: pointer; z-index: 2000; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
        Activar Modo Oscuro
    </button>

    <script src="app.js"></script>
