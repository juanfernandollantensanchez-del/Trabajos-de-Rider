<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Empresa - Empléate</title>
    <style>
        :root {
            --primary: #7097c0;
            --primary-hover: #577ba4;
            --bg: #f2f6f9;
            --surface: #ffffff;
            --text: #2b3947;
            --border: #d4e0eb;
            --input-focus: #cde0f2;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .form-container {
            background-color: var(--surface);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(112, 151, 192, 0.15);
            padding: 2.5rem;
            width: 100%;
            max-width: 500px;
        }

        h1 { margin-top: 0; font-size: 1.6rem; margin-bottom: 1.5rem; text-align: center; color: var(--text); }

        .form-group { margin-bottom: 1.2rem; }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--input-focus);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }

        .btn-submit:hover { background-color: var(--primary-hover); }

        .btn-cancel {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #6a7c8e;
            text-decoration: none;
            font-weight: 500;
        }

        .btn-cancel:hover { text-decoration: underline; color: var(--text); }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Registrar Nueva Empresa</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="nombre">Nombre de la Empresa:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej: Tech Solutions SAS">
            </div>

            <div class="form-group">
                <label for="nit">NIT (Identificador Único):</label>
                <input type="text" id="nit" name="nit" required placeholder="Ej: 900.123.456-7">
            </div>

            <div class="form-group">
                <label for="representante">Representante Legal:</label>
                <input type="text" id="representante" name="representante" required placeholder="Nombre completo">
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" required placeholder="contacto@empresa.com">
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" name="telefono" required placeholder="Ej: 3101234567">
            </div>

            <div class="form-group">
                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" name="direccion" required placeholder="Ej: Calle 123 # 45-67">
            </div>

            <button type="submit" class="btn-submit">Guardar Registro</button>
            <a href="{% url 'lista_empresas' %}" class="btn-cancel">Cancelar y volver</a>
        </form>
    </div>
</body>
</html>
