<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar vacante</title>
</head>
<body>

    <h1>Editar vacante</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Cargo:</label><br>
        <input
            type="text"
            name="cargo"
            value="{{ vacante.cargo }}"
            required
        >
        <br><br>

        <label>Categoría:</label><br>
        <input
            type="text"
            name="categoria"
            value="{{ vacante.categoria }}"
            required
        >
        <br><br>

        <label>Descripción:</label><br>
        <textarea name="descripcion">{{ vacante.descripcion }}</textarea>
        <br><br>

        <label>Salario:</label><br>
        <input
            type="number"
            name="salario"
            value="{{ vacante.salario }}"
            step="0.01"
            required
        >
        <br><br>

        <label>Empresa:</label><br>
        <input
            type="text"
            name="empresa"
            value="{{ vacante.empresa }}"
            required
        >
        <br><br>

        <button type="submit">
            Guardar cambios
        </button>

    </form>

    <br>

    <a href="{% url 'inicio' %}">
        Cancelar
    </a>

</body>
</html>
