<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registrar hoja de vida</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef4f8;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            overflow: hidden;
        }

        .encabezado {
            background: linear-gradient(135deg, #0066cc, #00a8e8);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .encabezado h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .encabezado p {
            font-size: 15px;
            opacity: 0.9;
        }

        .formulario {
            padding: 35px;
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 22px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .campo input,
        .campo textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd6df;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .campo input:focus,
        .campo textarea:focus {
            border-color: #008fe5;
            box-shadow: 0 0 0 3px rgba(0,143,229,0.12);
        }

        .campo textarea {
            min-height: 110px;
            resize: vertical;
        }

        .campo input[type="file"] {
            background: #f8fafc;
            cursor: pointer;
        }

        .info-pdf {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .boton {
            text-align: center;
            margin-top: 30px;
        }

        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #004c99;
            transform: translateY(-2px);
        }

        @media (max-width: 700px) {

            .fila {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .formulario {
                padding: 25px 20px;
            }

            .encabezado h1 {
                font-size: 24px;
            }

        }

    </style>

</head>

<body>

    <div class="contenedor">

        <div class="encabezado">

            <h1>📄 Registrar hoja de vida</h1>

            <p>
                Completa tu información para comenzar
                a buscar oportunidades laborales
            </p>

        </div>


        <form class="formulario"
              method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}


            <div class="fila">

                <div class="campo">

                    <label>📍 Dirección</label>

                    <input
                        type="text"
                        name="direccion"
                        placeholder="Ingresa tu dirección"
                        required>

                </div>


                <div class="campo">

                    <label>🎓 Educación</label>

                    <textarea
                        name="educacion"
                        placeholder="Describe tus estudios"
                        required></textarea>

                </div>

            </div>


            <div class="fila">

                <div class="campo">

                    <label>📄 Soporte de educación</label>

                    <input
                        type="file"
                        name="soporte_educacion"
                        accept=".pdf,application/pdf"
                        required>

                    <span class="info-pdf">
                        Solo se permiten archivos PDF.
                    </span>

                </div>


                <div class="campo">

                    <label>💼 Experiencia laboral</label>

                    <textarea
                        name="experiencia_laboral"
                        placeholder="Describe tu experiencia laboral"
                        required></textarea>

                </div>

            </div>


            <div class="fila">

                <div class="campo">

                    <label>📄 Soporte de experiencia laboral</label>

                    <input
                        type="file"
                        name="soporte_experiencia"
                        accept=".pdf,application/pdf"
                        required>

                    <span class="info-pdf">
                        Solo se permiten archivos PDF.
                    </span>

                </div>


                <div class="campo">

                    <label>🌎 Idiomas</label>

                    <input
                        type="text"
                        name="idiomas"
                        placeholder="Ejemplo: Español, Inglés"
                        required>

                </div>

            </div>


            <div class="fila">

                <div class="campo">

                    <label>⚖️ Antecedentes penales</label>

                    <textarea
                        name="antecedentes_penales"
                        placeholder="Ingresa la información correspondiente"
                        required></textarea>

                </div>


                <div class="campo">

                    <label>⭐ Habilidades</label>

                    <textarea
                        name="habilidades"
                        placeholder="Ejemplo: Trabajo en equipo, liderazgo..."
                        required></textarea>

                </div>

            </div>


            <div class="boton">

                <button type="submit">
                    Registrar hoja de vida
                </button>

            </div>

        </form>

    </div>

</body>

</html>
