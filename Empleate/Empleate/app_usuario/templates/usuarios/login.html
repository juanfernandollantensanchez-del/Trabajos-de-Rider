{% extends 'usuarios/base.html' %}

{% block title %}Iniciar Sesión - Empléate{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h2>Iniciar Sesión</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Ingresar</button>
    </form>
    <p style="text-align: center; margin-top: 15px;">
        ¿No tienes cuenta? <a href="{% url 'registro_usuario' %}" style="color: var(--azul-oscuro);">Regístrate aquí</a>
    </p>
</div>
{% endblock %}
